<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

    <h1>Inicio de Sesión</h1>

    <form action="/validar" method="POST">

        <label>Usuario:</label>
        <input type="text" name="usuario" required>

        <br><br>

        <label>Contraseña:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Ingresar
        </button>

    </form>

</body>

</html>
